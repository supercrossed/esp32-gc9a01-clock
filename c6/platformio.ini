; Waveshare ESP32-C6-Touch-AMOLED-1.43
;
;   pio run -d c6 -t upload                      the clock, from the repo root
;   pio run -d c6 -e c6_displaytest -t upload    bring-up test
;
; Its own PlatformIO project, sharing ../src with the GC9A01 boards. Two
; reasons it is not just another env in the root platformio.ini:
;
;   * The ESP32-C6 needs Arduino core 3, which the official espressif32
;     platform never got, so this uses the pioarduino fork.
;   * Both platforms install a package called framework-arduinoespressif32,
;     and PlatformIO keeps one copy per name. In one project they overwrite
;     each other on every switch: a full re-download per build, and the
;     first C6 env after an S3 build fails because its framework is gone.
;     A separate package store for this project ends that.
;
; TFT_eSPI is absent on purpose: it cannot drive a QSPI AMOLED and does not
; build for the C6. The faces render through src/c6/canvas.cpp instead.

[platformio]
src_dir      = ../src
packages_dir = ~/.platformio/packages-pioarduino
platforms_dir = ~/.platformio/platforms-pioarduino
default_envs = c6_clock, c6_displaytest

[c6]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board     = esp32-c6-devkitc-1
board_build.partitions    = default_16MB.csv
board_build.flash_size    = 16MB
; DIO, and not by choice: the pioarduino builder rewrites qio and qout to dio
; for every board (_get_board_flash_mode in builder/main.py), so asking for
; QIO here changes nothing - the image still comes out DIO, which is worth
; knowing before anyone tries it again. Faster flash reads would help, since
; the rasterisers and font tables are executed and read straight from flash.
board_build.flash_mode    = dio
board_upload.flash_size   = 16MB
board_upload.maximum_size = 16777216

monitor_speed = 115200
upload_speed  = 115200

lib_deps =
    bblanchon/ArduinoJson@^7.0.4

; Writes firmware/c6/<env>.bin in the repo root, like the other boards.
extra_scripts = post:../scripts/export_firmware.py

; -Os is the Arduino default and it costs real time on this board: the
; rasterisers are tight per-pixel loops, and size-first compilation will not
; unroll or inline them. -O2 is worth several milliseconds a frame on a face
; that is render-bound, at the price of a larger binary - and this board has
; 16 MB of flash with the app using under a tenth of it.
build_unflags = -Os
build_flags =
    -O2
    -D AMOLED_C6
    ; native USB-Serial-JTAG, same story as the C3: keep Serial on UART0
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=0

[env:c6_clock]
extends = c6
build_src_filter = +<*> -<tools/> -<tft/>

; Colour bands, all three fonts, a dot that follows a finger. No WiFi.
[env:c6_displaytest]
extends = c6
build_src_filter = +<c6/> +<tools/c6_test.cpp>
