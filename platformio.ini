; GC9A01 240x240 round SPI LCD clock
;
;   pio run -e casio       -t upload   segmented LCD face      (ESP32-S3)
;   pio run -e mosaic      -t upload   pixel-tile face         (ESP32-S3)
;   pio run -e default     -t upload   analog face             (ESP32-S3)
;   pio run -e c3_casio    -t upload   same faces on ESP32-C3
;   pio run -e displaytest -t upload   colour-cycle bring-up test
;
; The face code is chip-agnostic; everything chip-specific lives in the
; [s3] and [c3] profiles below.

; ============================ shared =======================================
[base]
platform  = espressif32@6.9.0
framework = arduino
board_build.partitions = huge_app.csv

monitor_speed = 115200
upload_speed  = 115200   ; native USB-Serial-JTAG ignores baud; high values wedge the handshake

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.0.4

; Every build drops a ready-to-flash image into firmware/<board>/<face>.bin,
; so the per-board folders stay current without a separate step.
extra_scripts = post:scripts/export_firmware.py

build_flags =
    ; ---- native USB (both chips enumerate as USB-Serial-JTAG, VID 303A) ----
    -D ARDUINO_USB_MODE=1
    ; CDC_ON_BOOT=0 deliberately. The hardware USB-CDC never delivered output
    ; to a host and repeatedly wedged the esptool reset handshake; writing into
    ; a ring buffer nothing drains can stall the render loop. Serial goes to
    ; UART0 instead, so prints are harmless no-ops. The USB-Serial-JTAG
    ; hardware still handles flashing. For logs, attach a USB-UART adapter.
    -D ARDUINO_USB_CDC_ON_BOOT=0

    ; ---- TFT_eSPI configuration (replaces User_Setup.h) ----
    -D USER_SETUP_LOADED=1
    -D GC9A01_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_MISO=-1
    ; no TFT_BL: this 7-pin panel has no backlight line, it is lit permanently.

    ; ---- fonts ----
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1

; ======================= ESP32-S3 Super Mini ===============================
[s3]
extends = base
board = esp32-s3-devkitm-1
; Super Mini ESP32-S3: rev0.2, 4MB flash, no PSRAM (verified via esptool flash_id).
; The stock devkitm-1 profile declares 8MB flash, which bootloops on this chip.
board_upload.flash_size   = 4MB
board_upload.maximum_size = 4194304
board_build.flash_size    = 4MB

build_flags =
    ${base.build_flags}

    ; MANDATORY on ESP32-S3, and MUST NOT be set on C3 (see the [c3] note).
    ; TFT_eSPI defaults SPI_PORT to FSPI, which the Arduino core defines as 0
    ; on the S3. The IDF's macro
    ;   REG_SPI_BASE(i) = ((i)>=2) ? (DR_REG_SPI2_BASE + (i-2)*0x1000) : 0
    ; then maps port 0 to address 0x00000000, so every register write lands on
    ; a null address and nothing is ever clocked out - backlight on, screen
    ; black. TFT_eSPI's own #ifndef REG_SPI_BASE patch never applies because
    ; driver/spi_master.h has already defined it. USE_HSPI_PORT puts both the
    ; register writes and the SPIClass instance on SPI3, which agree.
    -D USE_HSPI_PORT

    ; ---- pin map ----
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=13
    -D TFT_RST=9

    ; 40 MHz = 80/2, confirmed stable. Drop to 26666666 (80/3) if glitching.
    -D SPI_FREQUENCY=40000000

; ======================= ESP32-C3 Super Mini ===============================
[c3]
extends = base
board = esp32-c3-devkitm-1
board_upload.flash_size   = 4MB
board_upload.maximum_size = 4194304
board_build.flash_size    = 4MB

; TFT_eSPI needs a source-level fix on the C3 that cannot be expressed as a
; -D flag, because it hardcodes SPI_PORT. See scripts/patch_tft_c3.py.
; extra_scripts does not merge across `extends`, so the export hook inherited
; from [base] has to be repeated here alongside it.
extra_scripts =
    pre:scripts/patch_tft_c3.py
    post:scripts/export_firmware.py

build_flags =
    ${base.build_flags}

    ; NOTE: no USE_HSPI_PORT here. The C3 has a single general-purpose SPI
    ; (SOC_SPI_PERIPH_NUM 2 = flash bus + SPI2) and TFT_eSPI_ESP32_C3.h
    ; hardcodes SPI_PORT = SPI2_HOST, so the flag would do nothing useful.
    ;
    ; That hardcoding is ALSO why this chip needs the source patch: SPI2_HOST
    ; is an enum whose value is 1, and the IDF's C3 macro is
    ;   REG_SPI_BASE(i) = ((i)==2) ? DR_REG_SPI2_BASE : 0
    ; so index 1 resolves to address 0 and the panel stays black. Since
    ; SPI_PORT is #defined unconditionally it cannot be overridden from here -
    ; hence extra_scripts above. Do not assume SPI2_HOST == 2; it does not.

    ; ---- pin map: the C3's *native IOMUX* SPI2 pins ----
    ; SPI2_IOMUX_PIN_NUM_CLK=6, _MOSI=7, _CS=10 (soc/spi_pins.h). These are
    ; NOT the pins the Super Mini silkscreen labels SCK/MOSI/SS - those are
    ; the Arduino defaults (4/6/7), which route via the GPIO matrix. The
    ; matrix is only rated to about 40 MHz, which is exactly where we run,
    ; so the IOMUX pins give the margin.
    ; DC and RST are plain GPIOs; 4 and 5 are free and not strapping pins.
    ; Avoided: 2/8/9 (strapping, 8 also drives the onboard LED), 12-17 (SPI
    ; flash), 18/19 (USB), 20/21 (UART0).
    -D TFT_SCLK=6
    -D TFT_MOSI=7
    -D TFT_CS=10
    -D TFT_DC=5
    -D TFT_RST=4

    -D SPI_FREQUENCY=40000000

; ============================ watch faces ==================================
; All faces are compiled into one binary and rotate at runtime; the running
; order and dwell time are at the top of src/main.cpp. Each face lives in its
; own namespace, which is what lets them coexist.

[env:clock]
extends = s3
build_src_filter = +<*> -<tools/>

[env:c3_clock]
extends = c3
build_src_filter = +<*> -<tools/>

; ---------------- theme previews ----------------
; Pin a face's day/night theme so a look can be checked without waiting for
; the sun. These deliberately drop the export hook: a preview is not a release
; image and must not land in firmware/.

[env:c3_retro_night]
extends = c3
extra_scripts = pre:scripts/patch_tft_c3.py
build_flags = ${c3.build_flags} -D FORCE_NIGHT
build_src_filter = +<*> -<tools/>

[env:c3_retro_day]
extends = c3
extra_scripts = pre:scripts/patch_tft_c3.py
build_flags = ${c3.build_flags} -D FORCE_DAY
build_src_filter = +<*> -<tools/>

; ---------------- bring-up: colour cycle, no WiFi, slow SPI ----------------
[env:displaytest]
extends = s3
build_flags = ${s3.build_flags} -D SPI_FREQUENCY=10000000
build_src_filter = +<tools/display_test.cpp>

[env:c3_displaytest]
extends = c3
build_flags = ${c3.build_flags} -D SPI_FREQUENCY=10000000
build_src_filter = +<tools/display_test.cpp>
